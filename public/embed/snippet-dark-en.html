<!-- SG WebLab credit — dark theme, EN (paste before </body>) -->
<style>
  .sgwl-credit {
    display: block;
    width: 100%;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.8125rem;
    line-height: 1.2;
    -webkit-font-smoothing: antialiased;
    background: hsl(222 47% 8%);
    color: hsl(60 20% 98%);
    border-top: 1px solid hsl(222 30% 18% / 0.8);
  }

  .sgwl-credit__inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.375rem;
    padding: 0.3125rem 1rem;
  }

  .sgwl-credit__link {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    color: inherit;
    text-decoration: none;
    border-radius: 0.375rem;
    padding: 0.125rem 0.25rem;
    transition: color 150ms ease-out;
  }

  .sgwl-credit__link:hover {
    color: hsl(60 20% 100%);
  }

  .sgwl-credit__link:focus-visible {
    outline: 2px solid hsl(43 74% 49%);
    outline-offset: 2px;
  }

  .sgwl-credit__label {
    color: hsl(215 20% 65%);
  }

  .sgwl-credit__brand {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 600;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  .sgwl-credit__accent {
    color: hsl(43 74% 49%);
  }

  @media (prefers-reduced-motion: reduce) {
    .sgwl-credit__link {
      transition: none;
    }
  }
</style>

<aside class="sgwl-credit" role="complementary" aria-label="Website creator information">
  <div class="sgwl-credit__inner">
    <a
      class="sgwl-credit__link"
      href="https://sgweblab.com/en?utm_source=client-site&utm_medium=referral&utm_campaign=credit-footer"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="SG WebLab — visit agency website"
    >
      <span class="sgwl-credit__label">Design & build —</span>
      <span class="sgwl-credit__brand" aria-hidden="true">
        <span class="sgwl-credit__accent">SG</span>WebLab<span class="sgwl-credit__accent">.</span>
      </span>
    </a>
  </div>
</aside>
